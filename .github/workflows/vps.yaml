name: VPS

on:
    push:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test ./... -v -cover

    deploy:
        runs-on: ubuntu-latest
        needs: test # tunggu job test selesai dan passed dulu

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.22"

            - name: Build binary API
              run: |
                  GOOS=linux GOARCH=amd64 go build -o bin/api ./cmd/api/main.go

            - name: Build binary Worker
              run: |
                  GOOS=linux GOARCH=amd64 go build -o bin/worker ./cmd/worker/main.go

            - name: Copy binary to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  source: "bin/api, bin/worker"
                  target: "/app/golang-playground"

            - name: Copy .env to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  source: ".env.production"
                  target: "/app/golang-playground"

            - name: Restart service
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      cd /app/golang-playground

                      # rename .env
                      mv .env.production .env

                      # restart api
                      pkill -f "bin/api" || true
                      nohup ./bin/api > logs/api.log 2>&1 &

                      # restart worker
                      pkill -f "bin/worker" || true
                      nohup ./bin/worker > logs/worker.log 2>&1 &

                      echo "Deploy success!"
